name: CI

# Both platforms matter more here than in most projects. sxsh binds
# posix_spawn, waitpid and the job-control signals directly, and Linux and
# macOS disagree on several of the constants involved (SIGCONT is 18 vs 19,
# SIGTSTP 20 vs 18, SIGCHLD 17 vs 20, WCONTINUED 8 vs 16, and the opaque
# posix_spawn structs are inline on glibc but pointers on Darwin). Several
# real bugs in this code were invisible on one platform and fatal on the other,
# so a green run on a single OS proves very little.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # a Linux-only failure must not hide a macOS one
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      # ocicl is this project's Lisp toolchain. Its runtime supplies ASDF and
      # points the source registry at the current directory, which is how the
      # systems are found -- a stock SBCL has neither, and `asdf:test-system'
      # fails at READ time with "Package ASDF does not exist".
      - name: Install ocicl (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          ver=2.17.0
          curl -fsSL -o /tmp/ocicl.tar.gz \
            "https://github.com/ocicl/ocicl/releases/download/v${ver}/ocicl-${ver}-linux-amd64.tar.gz"
          # into its own directory: the archive is rooted at ./, so unpacking
          # straight into /tmp makes tar try to chmod /tmp and fail
          mkdir -p /tmp/ocicl-dist
          tar -xzf /tmp/ocicl.tar.gz -C /tmp/ocicl-dist
          bin=$(find /tmp/ocicl-dist -type f -name ocicl -perm -u+x | head -1)
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/ocicl

      - name: Install ocicl (macOS)
        if: runner.os == 'macOS'
        run: brew install ocicl

      # `ocicl setup` writes the runtime; loading it from ~/.sbclrc is what
      # makes a plain `sbcl` invocation work, exactly as on a developer machine.
      - name: Configure ocicl
        run: |
          set -eux
          ocicl version
          ocicl setup
          # `ocicl setup` prints TWO forms and both are required: the load
          # brings in ASDF, and initialize-source-registry is what puts the
          # current directory on the search path so this project's .asd is
          # found. With only the first, ASDF reports `Component "sxsh" not
          # found'. printf rather than a heredoc, whose terminator cannot be
          # indented to match the YAML block.
          printf '%s\n' \
            '#-ocicl' \
            '(when (probe-file #P"~/.local/share/ocicl/ocicl-runtime.lisp")' \
            '  (load #P"~/.local/share/ocicl/ocicl-runtime.lisp"))' \
            '(asdf:initialize-source-registry' \
            '  (list :source-registry (list :directory (uiop:getcwd))' \
            '        :inherit-configuration))' \
            >> "$HOME/.sbclrc"
          cat "$HOME/.sbclrc"
          sbcl --non-interactive --eval '(format t "~&asdf ~A~%" (asdf:asdf-version))'

      - name: Report toolchain
        run: |
          sbcl --version
          ocicl version | head -1
          python3 --version
          bash --version | head -1
          uname -a

      - name: Parser suite
        run: make test-parser

      - name: Executor suite
        run: make test-shell

      - name: Build executable
        run: make build

      - name: Smoke tests
        run: make smoke

      # Needs a pty; GitHub runners provide one via the python pty module even
      # though the job itself has no attached terminal.
      - name: Job-control tests (pty)
        run: make jobs

      - name: POSIX conformance (vs bash)
        run: make posix

      # dash is the stricter reference: it has none of bash's extensions, so
      # divergences it reports are more likely to be real POSIX violations.
      - name: POSIX conformance (vs dash)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y dash
          make posix REF_SHELL=/bin/dash
        continue-on-error: true   # informational until the dash delta is triaged
